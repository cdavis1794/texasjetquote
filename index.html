          const placeholder = input.getAttribute("placeholder") || "";
          if (input.type === "date") setLabel(input, "Departure date");
          else if (placeholder) setLabel(input, placeholder.replace(/\s*\([^)]*\)\s*$/, ""));

          if (/full name/i.test(placeholder)) input.setAttribute("autocomplete", "name");
          if (/email/i.test(placeholder)) {
            input.setAttribute("type", "email");
            input.setAttribute("autocomplete", "email");
          }
          if (/phone/i.test(placeholder)) {
            input.setAttribute("type", "tel");
            input.setAttribute("autocomplete", "tel");
          }
        });

        root.querySelectorAll("select").forEach((select) => setLabel(select, "Number of passengers"));
      };

      const enhanceLinks = () => {
        root.querySelectorAll("a[href]").forEach((link) => {
          if (!link.textContent.trim()) {
            const destination = link.hostname.includes("villiers") ? "Villiers booking" : "external page";
            setLabel(link, `Open ${destination} in a new tab`);
          }
        });
      };

      const enhanceButtons = () => {
        root.querySelectorAll("div.fixed > button.group").forEach((button) => {
          setLabel(button, "Open TexasJetQuote AI quote agent");
        });
      };

      const enhanceFaq = () => {
        root.querySelectorAll("#faq button").forEach((button, index) => {
          const panel = button.parentElement?.children[1];
          button.setAttribute("aria-expanded", panel ? "true" : "false");
          if (panel) {
            const panelId = `faq-answer-${index + 1}`;
            panel.id = panelId;
            panel.setAttribute("role", "region");
            panel.setAttribute("aria-label", button.textContent.trim());
            button.setAttribute("aria-controls", panelId);
          } else {
            button.removeAttribute("aria-controls");
          }
        });
      };

      const findDialog = () => Array.from(root.querySelectorAll("div")).find((element) =>
        element.classList.contains("max-w-[380px]") && element.querySelector("button")
      );

      const enhanceDialog = () => {
        const dialog = findDialog();
        if (!dialog) {
          inertElements.forEach((element) => { element.inert = false; });
          inertElements = [];
          if (activeDialog) {
            const launcher = Array.from(root.querySelectorAll("button")).find((button) =>
              button.textContent.includes("AI Quote Agent")
            );
            (returnFocus?.isConnected ? returnFocus : launcher)?.focus();
          }
          activeDialog = null;
          return;
        }

        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        const title = Array.from(dialog.querySelectorAll("div")).find((element) =>
          element.textContent.trim() === "TEXASJETQUOTE AI"
        );
        if (title) {
          title.id = "quote-agent-title";
          dialog.setAttribute("aria-labelledby", title.id);
        } else {
          setLabel(dialog, "TexasJetQuote AI quote agent");
        }

        const closeButton = dialog.querySelector("button");
        setLabel(closeButton, "Close quote agent");
        if (dialog !== activeDialog) {
          returnFocus = document.activeElement;
          activeDialog = dialog;
          const shell = Array.from(root.querySelectorAll("div")).find((element) =>
            element.classList.contains("min-h-screen") && element.contains(dialog)
          );
          inertElements = shell ? Array.from(shell.children).filter((element) => !element.contains(dialog)) : [];
          inertElements.forEach((element) => { element.inert = true; });
          requestAnimationFrame(() => closeButton?.focus());
        }
      };

      const enhanceStatuses = () => {
        root.querySelectorAll(".bg-amber-500\\/15").forEach((element) => element.setAttribute("role", "alert"));
        root.querySelectorAll(".bg-emerald-500\\/10").forEach((element) => {
          element.setAttribute("role", "status");
          element.setAttribute("aria-live", "polite");
        });
        root.querySelectorAll(".animate-spin").forEach((spinner) => {
          spinner.setAttribute("aria-hidden", "true");
          const status = spinner.parentElement;
          status?.setAttribute("role", "status");
          status?.setAttribute("aria-live", "polite");
        });
      };

      const enhance = () => {
        enhanceForms();
        enhanceLinks();
        enhanceButtons();
        enhanceFaq();
        enhanceDialog();
        enhanceStatuses();
      };

      document.addEventListener("keydown", (event) => {
        if (!activeDialog) return;
        if (event.key === "Escape") {
          activeDialog.querySelector("button")?.click();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = Array.from(activeDialog.querySelectorAll(
          'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'
        ));
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      new MutationObserver(enhance).observe(root, { childList: true, subtree: true });
      enhance();
    })();
  </script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if(u.hostname==="villiers.ai"&&!u.searchParams.has("id")){u.searchParams.set("id","1673");a.setAttribute("href",u.toString());}if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel=u.hostname==="villiers.ai"?"sponsored noopener noreferrer":"noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
